# nginx del container "frontend". Hace dos cosas:
#   1. servir la SPA Angular en "/"
#   2. reenviar /api/... al backend (php-fpm via fastcgi en el puerto 9000)
#
# server_name ecotraffic.local => la maquina cliente debe tener en /etc/hosts:
#       <IP de LORCA>   ecotraffic.local
# para resolver ese dominio.

server {
    listen 80;
    server_name ecotraffic.local;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular: cualquier path que no exista como archivo
    # se redirige a index.html para que el router del SPA lo gestione.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas al API se envian al container backend via FastCGI.
    # REQUEST_URI viaja tal cual ("/api/login"), asi Laravel encuentra
    # las rutas de routes/api.php (que ya estan prefijadas con /api).
    # No hay doble "/api/api/" porque el frontend en produccion usa
    # apiUrl = "/api" (entorno relativo, ver environment.production.ts).
    location /api/ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        include fastcgi_params;
    }

    # Cache agresivo para los assets que Angular nombra con hash unico.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
