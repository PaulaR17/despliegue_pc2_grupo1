#despliegue de EcoTraffic en LORCA usando el container postgres "pc2-db" ya existente (ver README)

services:

  backend:
    #docker clona el repo de GitHub durante el build
    build:
      context: https://github.com/PaulaR17/backend_pc2_grupo1.git#main
    container_name: ecotraffic_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      #pc2-db = nombre del container postgres existente en la red pc2-stack_default
      DB_HOST: pc2-db
      DB_PORT: 5432
      #PC1 corre en el mismo container, sin SSH
      ML_USE_SSH: "false"
      ML_PROJECT_PATH: /opt/pc1
      ML_PYTHON_BIN: /opt/pc1-venv/bin/python
      #PC1 lee estas para escribir en la tabla predictions
      PC2_DB_HOST: pc2-db
      PC2_DB_PORT: 5432
      PC2_DB_NAME: ${DB_DATABASE}
      PC2_DB_USER: ${DB_USERNAME}
      PC2_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - eco-net
      #conectamos tambien a la red del pc2-db para poder resolver su hostname
      - pc2-stack_default

  frontend:
    build:
      context: https://github.com/PaulaR17/frontend_pc2_grupo1.git#main
    container_name: ecotraffic_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      #nuestra nginx.conf sobreescribe la del repo del front
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - eco-net

volumes:
  laravel_storage:

networks:
  eco-net:
    driver: bridge
  #red ya existente donde vive el container pc2-db
  pc2-stack_default:
    external: true
