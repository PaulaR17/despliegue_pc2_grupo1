# Despliegue de EcoTraffic en la MV de LORCA.
#
# Este compose levanta los 3 servicios necesarios:
#   - postgres  : base de datos (volumen persistente)
#   - backend   : Laravel (php-fpm en :9000), se construye desde el repo de GitHub
#   - frontend  : Angular compilado + nginx, se construye desde el repo de GitHub
#
# Antes de "docker compose up -d --build":
#   1. cp .env.sample .env  y rellena los valores reales
#   2. anade en /etc/hosts:   <IP de LORCA>   ecotraffic.local
#
# Notas:
#   - El nginx que ve el usuario es el del container "frontend": sirve la SPA
#     en "/" y hace fastcgi a "backend:9000" cuando la ruta empieza por "/api".
#   - PC1 (machine learning) no esta incluido aqui. Las predicciones se
#     cargan en la tabla "predictions" ejecutando PC1 localmente contra la
#     BD de LORCA cuando haga falta.

services:

  postgres:
    image: postgres:14-alpine
    container_name: ecotraffic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eco-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 10

  backend:
    # Docker clona el repo de GitHub al construir, asi no hace falta tener
    # el codigo de back en local. Cambia el "#main" si trabajas en otra rama.
    build:
      context: https://github.com/PaulaR17/backend_pc2_grupo1.git#main
    container_name: ecotraffic_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      # storage de Laravel persistente: logs, ficheros subidos, cache...
      - laravel_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eco-net

  frontend:
    build:
      context: https://github.com/PaulaR17/frontend_pc2_grupo1.git#main
    container_name: ecotraffic_frontend
    restart: unless-stopped
    ports:
      # Si LORCA tiene el 80 ocupado, cambia a "8080:80" y ajusta /etc/hosts
      - "80:80"
    volumes:
      # Sobrescribimos la nginx.conf por defecto con la nuestra,
      # que ademas hace de proxy hacia el backend en /api.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - eco-net

volumes:
  pgdata:
  laravel_storage:

networks:
  eco-net:
    driver: bridge
